name: Promote server image

# Releases are built as pre-releases; promoting one (gh release edit <tag> --prerelease=false
# --latest) is what the Pis update to. Move countdown-server's :latest to the same release, so
# renderers on :latest run exactly what the Pis run. The image itself was pushed by release.yml.
on:
  release:
    types: [released]

permissions:
  packages: write

env:
  SERVER_IMAGE: ghcr.io/nvorkinn/countdown-server

jobs:
  tag-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Point :latest at this release's image
        env:
          TAG: ${{ github.event.release.tag_name }}
        # Copies the multi-platform manifest over; nothing is rebuilt.
        run: docker buildx imagetools create --tag "$SERVER_IMAGE:latest" "$SERVER_IMAGE:$TAG"
