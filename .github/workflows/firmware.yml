name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "countdown/countdown-esp/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "countdown/countdown-esp/**"
      - ".github/workflows/firmware.yml"
  # Release tags build the firmware through release.yml, which attaches it to the release.
  workflow_call:

defaults:
  run:
    working-directory: countdown/countdown-esp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cache pip + PlatformIO's downloaded toolchains/frameworks
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('countdown/countdown-esp/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      # Copy each environment's firmware.bin out of .pio with a clear name
      - name: Collect binaries
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME//\//-}"
          for dir in .pio/build/*/; do
            env=$(basename "$dir")
            cp "$dir/firmware.bin" "dist/countdown-esp-${env}-${ref}.bin"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: countdown/countdown-esp/dist/*.bin
          if-no-files-found: error
