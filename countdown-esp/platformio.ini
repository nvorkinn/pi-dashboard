; PlatformIO project configuration for the countdown ESP32 firmware.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-wrover-kit

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
