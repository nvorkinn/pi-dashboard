; PlatformIO project configuration for the countdown ESP32 firmware.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-wrover-kit

[env]
monitor_speed = 115200
build_flags = -Wall

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
lib_deps =
    tzapu/WiFiManager@^2.0.17
; The core's default is gnu++11; lib/broker_client needs C++17 (std::optional).
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    '-DBROKER_URL="https://auth.nikolaivorkinn.com"'

; The host-side unit tests for lib/broker_client, with coverage: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wextra
    -std=c++17
    --coverage
extra_scripts = post:scripts/link_coverage.py
