# Ships this Pi's journal to VictoriaLogs and its host metrics to VictoriaMetrics. Installed to
# /etc/fluent-bit/ by install.sh. FLUENT_BIT_TOKEN (the device secret) and DEVICE_NAME come from
# /etc/fluent-bit/env, which countdown writes once the broker has accepted its registration; Fluent Bit
# doesn't run before that (systemd/fluent-bit-env.conf).
service:
  flush: 5

pipeline:
  inputs:
    - name: systemd
      tag: journal
      # Off: the first start, right after registration, also sends what was logged before it.
      read_from_tail: off
      # Remembers where it got to, so a restart neither repeats nor skips lines.
      db: /var/lib/fluent-bit/journal.db
      lowercase: off

    # countdown's health gauges (countdown/core/.../otlp_publisher.py: METRICS_URL).
    - name: opentelemetry
      tag: metrics.countdown
      listen: 127.0.0.1
      port: 4318

    - name: cpu
      tag: metrics.cpu
      interval_sec: 60
    - name: mem
      tag: metrics.mem
      interval_sec: 60
    - name: disk
      tag: metrics.disk
      interval_sec: 60
    - name: thermal
      tag: metrics.thermal
      interval_sec: 60

  filters:
    - name: modify
      match: journal
      add: device_name ${DEVICE_NAME}

  outputs:
    - name: http
      match: journal
      host: logs.nikolaivorkinn.com
      port: 443
      tls: on
      uri: /insert/jsonline?_stream_fields=device_name,_SYSTEMD_UNIT&_msg_field=MESSAGE&_time_field=date
      format: json_lines
      json_date_key: date
      json_date_format: iso8601
      header: Authorization Bearer ${FLUENT_BIT_TOKEN}
      retry_limit: no_limits

    - name: prometheus_remote_write
      match: metrics.*
      host: metrics.nikolaivorkinn.com
      port: 443
      tls: on
      uri: /api/v1/write
      header: Authorization Bearer ${FLUENT_BIT_TOKEN}
      retry_limit: no_limits
      add_label: device_name ${DEVICE_NAME}
