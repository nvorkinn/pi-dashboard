# Drop-in for fluent-bit.service. It only runs once countdown has registered with the broker: that's
# when countdown writes /etc/fluent-bit/env (the device secret as the bearer token, and DEVICE_NAME).
# The unit stays enabled, so every later boot starts it by itself; fluent-bit-env.path covers the
# first start and a changed secret.
[Unit]
ConditionPathExists=/etc/fluent-bit/env

[Service]
# Not root: it only reads the journal (and listens on localhost), and the env file is written by countdown's user.
User=@USER@
SupplementaryGroups=systemd-journal
StateDirectory=fluent-bit
EnvironmentFile=/etc/fluent-bit/env
ExecStart=
ExecStart=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/fluent-bit.yaml
