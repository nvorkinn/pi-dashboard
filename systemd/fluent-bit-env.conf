# Drop-in for fluent-bit.service. It only runs once countdown has registered with the broker: that's
# when countdown writes /run/countdown/fluent-bit-env (the device secret as the bearer token, and DEVICE_NAME).
# That's in RAM, so it's gone at every reboot and countdown writes it again; fluent-bit-env.path starts Fluent Bit
# when it does, and restarts it when the secret changes.
[Unit]
ConditionPathExists=/run/countdown/fluent-bit-env

[Service]
# Not root: it only reads the journal (and listens on localhost), and the env file is written by countdown's user.
User=@USER@
SupplementaryGroups=systemd-journal
StateDirectory=fluent-bit
EnvironmentFile=/run/countdown/fluent-bit-env
ExecStart=
ExecStart=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/fluent-bit.yaml
