# Keeps the journal on disk, so the logs from before a crash or reboot are still there afterwards.
# Raspberry Pi OS makes it volatile (40-rpi-volatile-storage.conf) to spare the SD card; this
# sorts after that file, so it wins. Capped, so it can't fill the card.
[Journal]
Storage=persistent
SystemMaxUse=50M
MaxRetentionSec=3d
# Down from 5 minutes: a hard hang loses at most the last minute. Still batched, so little wear.
SyncIntervalSec=1m
