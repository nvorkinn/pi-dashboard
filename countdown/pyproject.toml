[project]
name = "countdown"
authors = [{ name = "Nikolai Vorkinn" }]

version = "0.4.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# The workspace's own packages, so `uv sync` installs them all (editable) for the tests.
dependencies = ["countdown-core", "countdown-standalone", "countdown-server"]

[tool.uv]
package = false

[tool.uv.sources]
countdown-core = { workspace = true }
countdown-standalone = { workspace = true }
countdown-server = { workspace = true }

[dependency-groups]
dev = [
    "pyinstrument>=5.1.3",
    "pyproject-runner>=0.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.3",
    "ruff>=0.16.8",
]

[tool.uv.workspace]
members = ["core", "standalone", "server"]

[tool.coverage.run]
source = ["core/src", "standalone/src", "server/src"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
# So isort knows the workspace packages are first-party.
src = ["core/src", "standalone/src", "server/src"]
extend-exclude = ["standalone/src/countdown_standalone/lib"]  # vendored Waveshare driver

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "TID251"]

# countdown-core must stay free of the e-paper hardware: the apps depend on it, never the other
# way round. The ban only applies inside core/ (see per-file-ignores).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"countdown_standalone".msg = "countdown-core can't depend on countdown-standalone; pass what it needs in from there"
"countdown_server".msg = "countdown-core can't depend on countdown-server; pass what it needs in from there"
"epd7in5_V2".msg = "The e-paper driver belongs to countdown-standalone"
"epdconfig".msg = "The e-paper driver belongs to countdown-standalone"

[tool.ruff.lint.per-file-ignores]
"!core/**" = ["TID251"]

[tool.pyproject-runner.tasks]

