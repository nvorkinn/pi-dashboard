[project]
name = "countdown"
version = "0.4.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gpiozero>=2.0.1.post3",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
    "np>=1.0.2",
    "numpy>=2.5.3",
    "paho-mqtt>=2.1.0",
    "pathlib>=1.0.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-tfl-api>=3.1.0",
    "requests>=2.32.5",
    "spidev>=3.8; sys_platform == 'linux'",
    "urllib3==2.8.0",
]

[project.scripts]
countdown = "countdown:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "countdown"

[dependency-groups]
dev = [
    "pyinstrument>=5.1.3",
    "pyproject-runner>=0.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.3",
    "ruff>=0.16.8",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["src/countdown/lib"]  # vendored Waveshare driver

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pyproject-runner.tasks]

