[project]
name = "countdown-core"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "np>=1.0.2",
    "numpy>=2.5.3",
    "paho-mqtt>=2.1.0",
    "pathlib>=1.0.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-tfl-api>=3.1.0",
    "requests>=2.32.5",
    "urllib3==2.8.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
