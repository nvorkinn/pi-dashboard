[project]
name = "countdown-client"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "countdown-credentials",
    "countdown-epd",
    "requests>=2.32.5",
    "urllib3==2.8.0",
]

[project.scripts]
countdown-client = "countdown_client.main:run"

[tool.uv.sources]
countdown-credentials = { workspace = true }
countdown-epd = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
