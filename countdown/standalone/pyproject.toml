[project]
name = "countdown-standalone"
version = "0.4.2"
requires-python = ">=3.14"
dependencies = [
    "countdown-epd",
    "countdown-core",
]

[project.scripts]
countdown-standalone = "countdown_standalone.main:run"

[tool.uv.sources]
countdown-core = { workspace = true }
countdown-epd = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
